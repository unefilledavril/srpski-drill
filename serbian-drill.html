<style>
  :root{
    --bg:#f2e7f5;
    --surface:#ffffff;
    --surface-2:#dfc8e4;
    --accent:#9169c1;
    --accent-dim:#b793d2;
    --deep:#462d86;
    --text:#3a2a5c;
    --text-dim:#8672a3;
    --ok:#2e7c28;
    --ok-soft:#82ac33;
    --bad:#b1466a;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:'Google Sans Flex',system-ui,sans-serif;width:100%;overflow-x:hidden;}
  #app{max-width:520px;margin:0 auto;padding:20px 16px 40px;background:var(--bg);width:100%;}

  @media (max-width:380px){
    #app{padding:16px 12px 32px;}
    .word-main{font-size:clamp(22px,7.5vw,30px);}
    .header h1{font-size:20px;}
  }

  .letter-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center;}
  .letter-btn{background:var(--surface-2);border:0;color:var(--deep);font-family:inherit;font-weight:600;font-size:16px;width:38px;height:38px;border-radius:10px;cursor:pointer;}
  .letter-btn:active{background:var(--accent);color:#fff;}

  .chip{background:var(--surface-2);border:0;color:var(--deep);font-family:inherit;font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:20px;cursor:pointer;opacity:.75;}
  .chip.active{background:var(--accent);color:#fff;opacity:1;}

  .topic-header{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:0;border-radius:12px;padding:12px 14px;color:var(--deep);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;}
  .topic-header .chevron{color:var(--accent);font-size:11px;}

  select{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;color:var(--deep);font-family:inherit;font-size:14px;}

  h1,h2,h3,.serif{font-family:'Google Sans Flex',system-ui,sans-serif;font-weight:700;}

  .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .header h1{font-size:22px;margin:0;letter-spacing:.2px;color:var(--deep);}
  .header .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .search-box{display:flex;gap:4px;flex-shrink:0;}
  .search-box input{width:110px;background:var(--surface);border:1.5px solid var(--surface-2);border-radius:20px;padding:8px 12px;color:var(--deep);font-family:inherit;font-size:12.5px;}
  .search-box input:focus{outline:none;border-color:var(--accent);}
  .search-btn{background:var(--accent);color:#fff;border:0;border-radius:20px;width:32px;font-size:14px;font-weight:700;cursor:pointer;}
  .search-msg{font-size:11.5px;color:var(--bad);text-align:right;margin:-10px 0 12px;}

  .tabs{display:flex;gap:8px;margin-bottom:18px;background:var(--surface);padding:5px;border-radius:14px;box-shadow:0 1px 3px rgba(70,45,134,.08);}
  .tab{flex:1;text-align:center;padding:10px 8px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-dim);transition:.15s;}
  .tab.active{background:var(--accent);color:#fff;}

  .panel{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(70,45,134,.08);}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;flex:1;min-width:140px;}
  .seg button{flex:1;background:none;border:0;color:var(--deep);opacity:.55;font-family:inherit;font-size:12.5px;padding:8px 6px;border-radius:8px;cursor:pointer;font-weight:600;}
  .seg button.active{background:var(--accent);color:#fff;opacity:1;}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin:10px 0 4px;font-weight:600;}

  .card-wrap{perspective:1200px;margin:18px 0 14px;}
  .card{position:relative;min-height:190px;border-radius:20px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d;}
  .card.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;border:1.5px dashed var(--accent-dim);}
  .front{background:radial-gradient(circle at 30% 20%, #f6ecf9, #ecdcf1);}
  .back{background:radial-gradient(circle at 70% 80%, #e4d3ee, #d7bfe6);transform:rotateY(180deg);}
  .card .tag{position:absolute;top:12px;left:14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);opacity:.85;}
  .word-main{font-size:30px;font-weight:700;line-height:1.25;color:var(--deep);}
  .word-sub{font-size:13px;color:var(--text-dim);margin-top:8px;}
  .word-meta{font-size:12px;color:var(--accent);margin-top:6px;font-weight:600;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:14px;opacity:.8;}

  .nav-row{display:flex;gap:8px;align-items:center;}
  .btn{border:0;border-radius:12px;padding:12px 14px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--deep);}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.ok{background:var(--ok);color:#fff;}
  .btn.bad{background:var(--bad);color:#fff;}
  .btn.ghost{background:transparent;border:1px solid var(--surface-2);color:var(--text-dim);}
  .btn.wide{flex:1;}
  .btn.small{padding:8px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:default;}

  input[type=text]{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:13px 14px;color:var(--deep);font-family:inherit;font-size:16px;}
  input[type=text]::placeholder{color:var(--text-dim);}
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  input[type=text].ok{border-color:var(--ok);}
  input[type=text].bad{border-color:var(--bad);}

  .timerbar-track{height:5px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-bottom:14px;}
  .timerbar-fill{height:100%;background:var(--accent);width:100%;}

  .score-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .score-row b{color:var(--deep);}

  .sentence{font-size:19px;line-height:1.5;font-family:'Google Sans Flex',system-ui,sans-serif;font-weight:500;text-align:center;padding:14px 6px 4px;color:var(--deep);}
  .ru-sentence{font-size:12.5px;text-align:center;color:var(--text-dim);padding-bottom:10px;}
  .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;}
  .pron-tag{display:inline-block;font-size:11px;color:var(--deep);background:var(--surface-2);padding:3px 9px;border-radius:20px;margin-bottom:10px;}
  .group-tag{font-size:11px;color:var(--accent);opacity:.9;}
  .rules-link{background:none;border:0;color:var(--accent);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(40,20,55,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-box{position:relative;background:var(--surface);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal-box h3{margin:0 0 4px;color:var(--deep);font-size:19px;font-family:'Google Sans Flex',system-ui,sans-serif;}
  .modal-sub{font-size:12px;color:var(--text-dim);margin-bottom:14px;}
  .modal-close{position:absolute;top:14px;right:14px;background:var(--surface-2);border:0;border-radius:8px;width:30px;height:30px;color:var(--deep);font-size:16px;cursor:pointer;}
  .conj-block{margin-bottom:16px;}
  .conj-title{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .conj-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .conj-table td, .conj-table th{border:1px solid var(--surface-2);padding:7px 5px;text-align:center;color:var(--deep);}
  .conj-table th{background:var(--surface-2);font-size:10.5px;color:var(--text-dim);font-weight:600;}

  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .opt{background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px 8px;text-align:center;font-weight:600;cursor:pointer;font-size:15px;color:var(--deep);}
  .opt.correct{border-color:var(--ok);background:#e4efd8;}
  .opt.wrong{border-color:var(--bad);background:#f6dfe7;}

  .feedback{font-size:13px;margin-top:10px;text-align:center;min-height:18px;}
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}

  .add-form{display:flex;gap:8px;margin-top:8px;}
  .add-form input{flex:1;}
  .stat-line{font-size:11px;color:var(--text-dim);text-align:center;margin-top:8px;}
  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:20px 10px;}
  a{color:var(--accent);}
</style>

ь"}, "past_fem": {"sg": "kupovala", "pl": "kupovale"}}, {"inf": "putovati", "ru": "путешествовать", "group": "-ujem", "pres": {"ja": "putujem", "ti": "putuješ", "on": "putuje", "mi": "putujemo", "vi": "putujete", "oni": "putuju"}, "ru_pres": {"ja": "путешествую", "ti": "путешествуешь", "on": "путешествует", "mi": "путешествуем", "vi": "путешествуете", "oni": "путешествуют"}, "ph": [{"sr": "u inostranstvo", "ru": "за границу"}, {"sr": "avionom", "ru": "на самолёте"}, {"sr": "svake godine", "ru": "каждый год"}], "past_masc": {"sg": "putovao", "pl": "putovali", "fem_sg": "putovala", "fem_pl": "putovale"}, "past": {"ja": "sam putovao/putovala", "ti": "si putovao/putovala", "on": "je putovao/putovala", "mi": "smo putovali/putovale", "vi": "ste putovali/putovale", "oni": "su putovali/putovale"}, "ru_past": {"ja": "путешествовал/путешествовала", "ti": "путешествовал/путешествовала", "on": "путешествовал/путешествовала", "mi": "путешествовали", "vi": "путешествовали", "oni": "путешествовали"}, "fut": {"ja": "ću putovati", "ti": "ćeš putovati", "on": "će putovati", "mi": "ćemo putovati", "vi": "ćete putovati", "oni": "će putovati"}, "ru_fut": {"ja": "буду путешествовать", "ti": "будешь путешествовать", "on": "будет путешествовать", "mi": "будем путешествовать", "vi": "будете путешествовать", "oni": "будут путешествовать"}, "past_fem": {"sg": "putovala", "pl": "putovale"}}];


const PRON = {ja:"Ja",ti:"Ti",on:"On / ona",mi:"Mi",vi:"Vi",oni:"Oni / one"};
const PKEYS = Object.keys(PRON);
const RU_PRON = {ja:"Я",ti:"Ты",on:"Он/она",mi:"Мы",vi:"Вы",oni:"Они"};
const TENSE_LABEL = {present:"наст. время", past:"прош. время", future:"буд. время"};
const TENSE_UI = [["present","Наст."],["past","Прош."],["future","Буд."],["all","Все"]];

/* ---------------- STORAGE-BACKED STATE ---------------- */

let custom = [];       // [{sr,ru,cat},...]
let known = {};         // sr -> 'known' | 'learning'

async function loadStore(){
  try{ const r = await window.storage.get('custom-words-lat-v2', false); custom = r? JSON.parse(r.value): []; }catch(e){ custom=[]; }
  try{ const r = await window.storage.get('known-status-lat', false); known = r? JSON.parse(r.value): {}; }catch(e){ known={}; }
}
async function saveCustom(){ try{ await window.storage.set('custom-words-lat-v2', JSON.stringify(custom), false); }catch(e){} }
async function saveKnown(){ try{ await window.storage.set('known-status-lat', JSON.stringify(known), false); }catch(e){} }

function allWords(){ return WORDS.concat(custom); }

/* ---------------- APP STATE ---------------- */

const S = {
  tab:'cards',
  dir:'sr-ru',        // sr-ru | ru-sr | mixed
  mode:'scroll',       // scroll | blitz | type
  filter:'all',         // all | learning
  selectedTopics: new Set(), // empty = all topics
  topicsOpen: false,
  deck:[], di:0, flipped:false, cardDir:'sr-ru',
  blitz:{q:null, timer:null, tLeft:0, score:0, total:0, answered:false, correct:null},
  typeCard:{q:null, feedback:null, checked:false},
  showAdd:false,
  vMode:'choice', // choice | type
  tense:'present', // present | past | future | all
  rulesFor:null,
  searchMsg:null,
  vQ:null, vOptions:[], vFeedback:null, vChecked:false, vScore:0, vTotal:0
};

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function topicPool(){
  const all = allWords();
  return S.selectedTopics.size ? all.filter(w=>S.selectedTopics.has(w.cat)) : all;
}

function buildDeck(){
  let pool = topicPool();
  if(S.filter==='learning') pool = pool.filter(w=> known[w.sr] !== 'known');
  S.deck = shuffle(pool).map(w=>({sr:w.sr, ru:w.ru, gender:w.gender, plural:w.plural, dir: S.dir==='mixed' ? (Math.random()<0.5?'sr-ru':'ru-sr') : S.dir}));
  S.di = 0; S.flipped = false;
}

function newBlitzQ(){
  const pool = topicPool();
  const w = pick(pool);
  const dir = S.dir==='mixed' ? (Math.random()<0.5?'sr-ru':'ru-sr') : S.dir;
  const isCorrect = Math.random() < 0.5;
  let shown;
  if(isCorrect){ shown = dir==='sr-ru' ? w.ru : w.sr; }
  else{
    let other; do{ other = pick(pool); } while(other.sr===w.sr);
    shown = dir==='sr-ru' ? other.ru : other.sr;
  }
  S.blitz.q = {w, dir, shown, isCorrect};
  S.blitz.answered = false; S.blitz.correct = null;
  clearInterval(S.blitz.timer);
  S.blitz.tLeft = 100;
  S.blitz.timer = setInterval(()=>{
    S.blitz.tLeft -= 2;
    const el = document.getElementById('timerfill');
    if(el) el.style.width = Math.max(0,S.blitz.tLeft)+'%';
    if(S.blitz.tLeft<=0){ answerBlitz(null); }
  }, 60);
}

function answerBlitz(userSaysCorrect){
  if(S.blitz.answered) return;
  clearInterval(S.blitz.timer);
  S.blitz.answered = true;
  const actuallyCorrect = S.blitz.q.isCorrect;
  const rightAnswer = (userSaysCorrect === actuallyCorrect);
  S.blitz.correct = userSaysCorrect===null ? 'timeout' : rightAnswer;
  S.blitz.total++;
  if(rightAnswer) S.blitz.score++;
  render();
  setTimeout(()=>{ newBlitzQ(); render(); }, 900);
}

function newTypeQ(){
  const pool = topicPool();
  const w = pick(pool);
  const dir = S.dir==='mixed' ? (Math.random()<0.5?'sr-ru':'ru-sr') : S.dir;
  S.typeCard = {q:{w,dir}, feedback:null, checked:false};
}

function checkType(){
  const val = document.getElementById('type-input').value.trim().toLowerCase();
  const {w,dir} = S.typeCard.q;
  const answer = (dir==='sr-ru' ? w.ru : w.sr).toLowerCase();
  const ok = val.length>0 && (answer===val || answer.split(/[\/,]/).some(a=>a.trim()===val));
  S.typeCard.checked = true;
  S.typeCard.feedback = ok ? 'ok' : 'bad';
  S.typeCard.correctAnswer = answer;
  render();
  if(ok){ setTimeout(()=>{ newTypeQ(); render(); }, 500); }
}

function insertChar(inputId, ch){
  const el = document.getElementById(inputId);
  if(!el) return;
  const start = el.selectionStart ?? el.value.length;
  const end = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0,start) + ch + el.value.slice(end);
  el.focus();
  const pos = start + ch.length;
  el.setSelectionRange(pos,pos);
}

function verbForms(v, tense){
  if(tense==='present') return {sr:v.pres, ru:v.ru_pres};
  if(tense==='past') return {sr:v.past, ru:v.ru_past};
  return {sr:v.fut, ru:v.ru_fut};
}

// "sam radio/radila" -> ["sam radio", "sam radila"]; "radim" -> ["radim"]
function acceptableAnswers(answer){
  const parts = answer.split(' ');
  const last = parts[parts.length-1];
  if(last.includes('/')){
    const prefix = parts.slice(0,-1).join(' ');
    return last.split('/').map(a => (prefix ? prefix+' ' : '') + a);
  }
  return [answer];
}

function buildRuSentence(pk, ruVerb, ruPhrase){
  const parts = [RU_PRON[pk], ruVerb, ruPhrase].filter(p=>p && p.length);
  const s = parts.join(' ');
  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}

function newVerbQ(forcedVerb){
  const v = forcedVerb || pick(VERBS);
  const pk = pick(PKEYS);
  const ph = pick(v.ph);
  const tense = S.tense==='all' ? pick(['present','past','future']) : S.tense;
  const forms = verbForms(v, tense);
  const answer = forms.sr[pk];
  const ruAnswer = forms.ru[pk];
  S.vQ = {v, pk, ph, answer, ruAnswer, tense};
  S.vChecked = false; S.vFeedback = null;
  if(S.vMode==='choice'){
    const uniqueOthers = [...new Set(PKEYS.filter(k=>k!==pk).map(k=>forms.sr[k]).filter(f=>f!==answer))];
    const wrong = shuffle(uniqueOthers).slice(0,3);
    S.vOptions = shuffle([answer, ...wrong]);
  }
}

function answerVerbChoice(opt){
  if(S.vChecked) return;
  S.vChecked = true;
  S.vFeedback = (opt===S.vQ.answer) ? 'ok' : 'bad';
  S.vTotal++; if(S.vFeedback==='ok') S.vScore++;
  render();
  if(S.vFeedback==='ok'){ setTimeout(()=>{ newVerbQ(); render(); }, 2000); }
}

function checkVerbType(){
  const val = document.getElementById('verb-input').value.trim().toLowerCase();
  S.vChecked = true;
  const candidates = acceptableAnswers(S.vQ.answer).map(a=>a.toLowerCase());
  S.vFeedback = candidates.includes(val) ? 'ok':'bad';
  S.vTotal++; if(S.vFeedback==='ok') S.vScore++;
  render();
  if(S.vFeedback==='ok'){ setTimeout(()=>{ newVerbQ(); render(); }, 2000); }
}

function doSearch(){
  const input = document.getElementById('global-search');
  if(!input) return;
  const q = input.value.trim().toLowerCase();
  if(!q) return;
  if(S.tab==='verbs'){
    let v = VERBS.find(x=>x.inf.toLowerCase()===q) || VERBS.find(x=>x.ru.toLowerCase()===q);
    if(!v) v = VERBS.find(x=>x.inf.toLowerCase().includes(q)) || VERBS.find(x=>x.ru.toLowerCase().includes(q));
    if(v){ S.searchMsg=null; newVerbQ(v); }
    else { S.searchMsg='Глагол не найден'; }
  } else {
    const pool = allWords();
    let w = pool.find(x=>x.sr.toLowerCase()===q) || pool.find(x=>x.ru.toLowerCase()===q);
    if(!w) w = pool.find(x=>x.sr.toLowerCase().includes(q)) || pool.find(x=>x.ru.toLowerCase().includes(q));
    if(w){
      S.searchMsg=null;
      S.mode='scroll';
      clearInterval(S.blitz.timer);
      S.deck = [{sr:w.sr, ru:w.ru, gender:w.gender, plural:w.plural, dir: S.dir==='mixed'?'sr-ru':S.dir}];
      S.di=0; S.flipped=false;
    } else { S.searchMsg='Слово не найдено'; }
  }
  render();
}

function topicsLabel(){
  const n = S.selectedTopics.size;
  if(n===0 || n===TOPICS.length) return 'выбраны все';
  return `выбрано ${n}`;
}

function toggleTopic(id){
  const s = new Set(S.selectedTopics);
  if(id==='__all__'){ s.clear(); }
  else if(s.has(id)){ s.delete(id); }
  else{ s.add(id); }
  S.selectedTopics = s;
  if(S.mode==='scroll') buildDeck();
  S.blitz.q=null; S.typeCard.q=null; clearInterval(S.blitz.timer);
}

/* ---------------- RENDER ---------------- */

function cardFace(w,dir,flipped){
  const front = dir==='sr-ru' ? w.sr : w.ru;
  const back = dir==='sr-ru' ? w.ru : w.sr;
  const frontIsSr = dir==='sr-ru';
  const meta = w.gender ? `<div class="word-meta">${w.gender}${w.plural? ' · мн. ч.: '+w.plural : ''}</div>` : '';
  return `
   <div class="card-wrap"><div class="card ${flipped?'flipped':''}" data-action="flip">
    <div class="face front"><span class="tag">${frontIsSr?'srpski':'русский'}</span>
      <div class="word-main">${front}</div>
      ${frontIsSr ? meta : ''}
      <div class="hint">нажми, чтобы перевернуть</div>
    </div>
    <div class="face back"><span class="tag">${frontIsSr?'русский':'srpski'}</span>
      <div class="word-main">${back}</div>
      ${!frontIsSr ? meta : ''}
    </div>
   </div></div>`;
}

  const st = known[S.deck[S.di]?.sr];
  return `
  <div class="panel">
    <div class="label">Направление</div>
    <div class="seg">
      <button data-action="dir" data-v="sr-ru" class="${S.dir==='sr-ru'?'active':''}">SR → RU</button>
      <button data-action="dir" data-v="ru-sr" class="${S.dir==='ru-sr'?'active':''}">RU → SR</button>
      <button data-action="dir" data-v="mixed" class="${S.dir==='mixed'?'active':''}">Вперемешку</button>

      <button data-action="mode" data-v="scroll" class="${S.mode==='scroll'?'active':''}">Листать</button>

    </div>

      <button data-action="filter" data-v="all" class="${S.filter==='all'?'active':''}">Все</button>

      </div>` : ''}
    </div>
  </div>

  ${renderCardBody(st)}

  <div class="panel">
    <div class="label">Добавить своё слово</div>
    <div class="add-form">
      <input type="text" id="add-sr" placeholder="сербский (латиница)">

function renderCardBody(st){
  if(S.mode==='scroll'){
    if(!S.deck.length) return `<div class="panel"><div class="empty">Все слова отмечены как «знаю» 🎉<br>Переключись на «Все слова», чтобы повторить их снова.</div></div>`;
    const w = S.deck[S.di];
    return `<div class="panel">
      ${cardFace(w, w.dir, S.flipped)}
      <div class="nav-row">
        <button class="btn ghost" data-action="prev">◀</button>
        <button class="btn bad wide" data-action="mark" data-v="learning">Ещё учу</button>
        <button class="btn ok wide" data-action="mark" data-v="known">✓ Знаю</button>
        <button class="btn ghost" data-action="next">▶</button>
      </div>
      <div class="stat-line">${S.di+1} / ${S.deck.length}${st?` · статус: ${st==='known'?'знаю':'учу'}`:''}</div>
    </div>`;
  }
  if(S.mode==='blitz'){
    if(!S.blitz.q) newBlitzQ();
    const b = S.blitz;
    return `<div class="panel">
      <div class="score-row"><span>Счёт: <b>${b.score}/${b.total}</b></span><span>${b.answered? (b.correct==='timeout'?'⏱ время вышло':(b.correct?'✓ верно':'✗ неверно')) : ''}</span></div>
      <div class="timerbar-track"><div class="timerbar-fill" id="timerfill" style="width:${b.tLeft}%"></div></div>
      <div class="card-wrap"><div class="card"><div class="face front" style="position:static;">
        <span class="tag">${b.q.dir==='sr-ru'?'srpski':'русский'}</span>
        <div class="word-main">${b.q.dir==='sr-ru'?b.q.w.sr:b.q.w.ru}</div>
        <div class="word-sub">${b.q.dir==='sr-ru'?'русский перевод:':'srpski prevod:'} <b>${b.q.shown}</b></div>
      </div></div></div>
      <div class="nav-row">
        <button class="btn bad wide" data-action="blitz" data-v="false" ${b.answered?'disabled':''}>✗ Неверно</button>
        <button class="btn ok wide" data-action="blitz" data-v="true" ${b.answered?'disabled':''}>✓ Верно</button>
      </div>
    </div>`;
  }
  // type mode
  if(!S.typeCard.q) newTypeQ();
  const t = S.typeCard, q = t.q;
  const prompt = q.dir==='sr-ru' ? q.w.sr : q.w.ru;
  const promptTag = q.dir==='sr-ru' ? 'srpski' : 'русский';
  const askTag = q.dir==='sr-ru' ? 'напиши перевод по-русски' : 'напиши перевод на сербском (латиница)';
  return `<div class="panel">
    <div class="card-wrap"><div class="card"><div class="face front" style="position:static;">
      <span class="tag">${promptTag}</span>
      <div class="word-main">${prompt}</div>
      <div class="hint">${askTag}</div>
    </div></div></div>
    <input type="text" id="type-input" class="${t.checked? t.feedback:''}" placeholder="ответ..." ${t.checked?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    ${(!t.checked && q.dir==='ru-sr') ? `<div class="letter-row">${['š','č','ć','ž','đ'].map(c=>`<button type="button" class="letter-btn" data-action="ins" data-target="type-input" data-v="${c}">${c}</button>`).join('')}</div>` : ''}
    <div class="feedback ${t.feedback||''}">${t.checked ? (t.feedback==='ok' ? '✓ Верно!' : `✗ Правильный ответ: ${t.correctAnswer}`) : ''}</div>
    <div class="nav-row" style="margin-top:10px;">
      ${t.checked && t.feedback==='bad' ? `<button class="btn primary wide" data-action="typenext">Далее →</button>`
                  : (t.checked ? '' : `<button class="btn primary wide" data-action="typecheck">Проверить</button>`)}
    </div>
  </div>`;
}

function renderConjTable(title, forms, note){
  return `<div class="conj-block">
    <div class="conj-title">${title}${note?` <span style="opacity:.7;font-weight:400;text-transform:none;">(${note})</span>`:''}</div>
    <table class="conj-table">
      <tr><th></th><th>Ед. число</th><th>Мн. число</th></tr>
      <tr><td>1-е лицо</td><td>${PRON.ja} ${forms.ja}</td><td>${PRON.mi} ${forms.mi}</td></tr>
      <tr><td>2-е лицо</td><td>${PRON.ti} ${forms.ti}</td><td>${PRON.vi} ${forms.vi}</td></tr>
      <tr><td>3-е лицо</td><td>${PRON.on} ${forms.on}</td><td>${PRON.oni} ${forms.oni}</td></tr>
    </table>
  </div>`;
}

function renderRulesModal(){
  if(!S.rulesFor) return '';
  const v = VERBS.find(x=>x.inf===S.rulesFor);
  if(!v) return '';
  return `<div class="modal-overlay" data-action="closerules">
    <div class="modal-box" data-action="noop">
      <button type="button" class="modal-close" data-action="closerules">×</button>
      <h3>${v.inf}</h3>
      <div class="modal-sub">${v.ru} · группа ${v.group}</div>
      ${renderConjTable('Настоящее время', v.pres)}
      ${renderConjTable('Прошедшее время', v.past)}
      ${renderConjTable('Будущее время', v.fut)}
    </div>
  </div>`;
}

function renderVerbs(){
  if(!S.vQ) newVerbQ();
  const {v,pk,ph,answer,ruAnswer,tense} = S.vQ;
  const sentence = `${PRON[pk]} <span class="blank">${S.vChecked? answer : '____'}</span> ${ph.sr}.`;
  const ruSentence = buildRuSentence(pk, ruAnswer, ph.ru);
  return `
  <div class="panel">
    <div class="label">Режим</div>
    <div class="seg">
      <button data-action="vmode" data-v="choice" class="${S.vMode==='choice'?'active':''}">Выбрать</button>
      <button data-action="vmode" data-v="type" class="${S.vMode==='type'?'active':''}">Вписать</button>
    </div>
    <div class="label">Время</div>
    <div class="seg">
      ${TENSE_UI.map(([id,label])=>`<button data-action="tense" data-v="${id}" class="${S.tense===id?'active':''}">${label}</button>`).join('')}
    </div>
  </div>
  <div class="panel">
    <div class="score-row">
      <span>Счёт: <b>${S.vScore}/${S.vTotal}</b></span>
      <span class="group-tag">${v.inf} · ${v.group} · ${v.ru}</span>
    </div>
    <div style="text-align:right;">
      <button type="button" class="rules-link" data-action="rules" data-v="${v.inf}">правила спряжения ⓘ</button>
    </div>
    <div class="pron-tag">${PRON[pk]} · ${TENSE_LABEL[tense]}</div>
    <div class="sentence">${sentence}</div>
    <div class="ru-sentence">${ruSentence}</div>
    ${S.vMode==='choice' ? `
      <div class="opt-grid">
        ${S.vOptions.map(o=>`<div class="opt ${S.vChecked && o===answer?'correct':''} ${S.vChecked && o!==answer?'wrong':''}" data-action="vchoice" data-v="${o}">${o}</div>`).join('')}
      </div>
      <div class="feedback ${S.vFeedback||''}">${S.vChecked ? (S.vFeedback==='ok'?'✓ Верно!':`✗ Правильно: ${answer}`) : 'Выбери правильную форму'}</div>
      <div class="nav-row" style="margin-top:10px;">
        ${S.vChecked && S.vFeedback==='bad' ? `<button class="btn primary wide" data-action="verbnext">Далее →</button>` : ''}
      </div>
    ` : `
      <input type="text" id="verb-input" class="${S.vChecked? S.vFeedback:''}" placeholder="впиши форму глагола" ${S.vChecked?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      ${!S.vChecked ? `<div class="letter-row">${['š','č','ć','ž','đ'].map(c=>`<button type="button" class="letter-btn" data-action="ins" data-target="verb-input" data-v="${c}">${c}</button>`).join('')}</div>` : ''}
      <div class="feedback ${S.vFeedback||''}">${S.vChecked ? (S.vFeedback==='ok'?'✓ Верно!':`✗ Правильно: ${answer}`) : ''}</div>
      <div class="nav-row" style="margin-top:10px;">
        ${S.vChecked && S.vFeedback==='bad' ? `<button class="btn primary wide" data-action="verbnext">Далее →</button>`
                     : (S.vChecked ? '' : `<button class="btn primary wide" data-action="verbcheck">Проверить</button>`)}
      </div>
    `}
  </div>
  ${renderRulesModal()}`;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <div><h1>Srpski</h1><div class="sub">лексика и глаголы, без пощады</div></div>
      <div class="search-box">
        <input type="text" id="global-search" placeholder="🔍 слово" autocomplete="off" autocapitalize="off">
        <button type="button" class="search-btn" data-action="dosearch">→</button>
      </div>
    </div>
    ${S.searchMsg? `<div class="search-msg">${S.searchMsg}</div>` : ''}
    <div class="tabs">
      <div class="tab ${S.tab==='cards'?'active':''}" data-action="tab" data-v="cards">Карточки</div>
      <div class="tab ${S.tab==='verbs'?'active':''}" data-action="tab" data-v="verbs">Глаголы</div>
    </div>
    ${S.tab==='cards' ? renderCards() : renderVerbs()}
  `;
  if(S.mode==='blitz' && S.tab==='cards'){
    const el = document.getElementById('timerfill');
    if(el) el.style.width = S.blitz.tLeft+'%';
  }
  if(S.tab==='cards' && S.mode==='type' && !S.typeCard.checked){
    const el = document.getElementById('type-input');
    if(el) el.focus();
  }
  if(S.tab==='verbs' && S.vMode==='type' && !S.vChecked){
    const el = document.getElementById('verb-input');
    if(el) el.focus();
  }
}

/* ---------------- EVENTS ---------------- */

document.getElementById('app').addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action, v = t.dataset.v;

  if(action==='tab'){ S.tab=v; if(v==='cards'&&S.mode==='scroll'&&!S.deck.length) buildDeck(); if(v==='verbs'&&!S.vQ) newVerbQ(); render(); return; }
  if(action==='dir'){ S.dir=v; S.blitz.q=null; S.typeCard.q=null; clearInterval(S.blitz.timer); if(S.mode==='scroll') buildDeck(); render(); return; }
  if(action==='mode'){ S.mode=v; clearInterval(S.blitz.timer); S.blitz.q=null; S.typeCard.q=null; if(v==='scroll') buildDeck(); render(); return; }
  if(action==='filter'){ S.filter=v; buildDeck(); render(); return; }
  if(action==='topictoggle'){ S.topicsOpen = !S.topicsOpen; render(); return; }
  if(action==='topic'){ toggleTopic(v); render(); return; }
  if(action==='flip'){ S.flipped=!S.flipped; render(); return; }
  if(action==='prev'){ S.di=(S.di-1+S.deck.length)%S.deck.length; S.flipped=false; render(); return; }
  if(action==='next'){ S.di=(S.di+1)%S.deck.length; S.flipped=false; render(); return; }
  if(action==='mark'){
    const w = S.deck[S.di]; known[w.sr]=v; await saveKnown();
    if(S.filter==='learning' && v==='known'){ S.deck.splice(S.di,1); if(S.di>=S.deck.length) S.di=0; S.flipped=false; }
    else { S.di=(S.di+1)%S.deck.length; S.flipped=false; }
    render(); return;
  }
  if(action==='blitz'){ answerBlitz(v==='true'); return; }
  if(action==='ins'){ insertChar(t.dataset.target, v); return; }
  if(action==='typecheck'){ checkType(); return; }
  if(action==='typenext'){ newTypeQ(); render(); return; }
  if(action==='vmode'){ S.vMode=v; newVerbQ(); render(); return; }
  if(action==='tense'){ S.tense=v; newVerbQ(); render(); return; }
  if(action==='rules'){ S.rulesFor=v; render(); return; }
  if(action==='closerules'){ S.rulesFor=null; render(); return; }
  if(action==='noop'){ return; }
  if(action==='vchoice'){ answerVerbChoice(v); return; }
  if(action==='verbcheck'){ checkVerbType(); return; }
  if(action==='verbnext'){ newVerbQ(); render(); return; }
  if(action==='dosearch'){ doSearch(); return; }
  if(action==='addword'){
    const sr = document.getElementById('add-sr').value.trim();
    const ru = document.getElementById('add-ru').value.trim();
    const cat = document.getElementById('add-cat').value;
    if(sr && ru){ custom.push({sr,ru,cat}); await saveCustom(); if(S.mode==='scroll') buildDeck(); render(); }
    return;
  }
});

document.getElementById('app').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    if(e.target.id==='type-input') checkType();
    if(e.target.id==='verb-input') checkVerbType();
    if(e.target.id==='add-ru'||e.target.id==='add-sr') document.querySelector('[data-action=addword]')?.click();
    if(e.target.id==='global-search') doSearch();
  }
});

/* ---------------- INIT ---------------- */

(async function init(){
  await loadStore();
  buildDeck();
  render();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* file:// or unsupported — silently ignore */ });
  }
})();

})();
</script>
